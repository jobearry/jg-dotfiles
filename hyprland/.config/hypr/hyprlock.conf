$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(15, 15, 20, 0.88)
    outer_color = rgba(63, 63, 82, 1.0)
    check_color = rgba(110, 150, 135, 1.0)
    fail_color = rgba(195, 64, 67, 1.0)
    font_color = rgb(242, 236, 188)
    font_family = $font
    font_size = 18
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 28
    font_family = $font
    color = rgb(242, 236, 188)
    position = 0, 48
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 56
    font_family = $font
    color = rgb(242, 236, 188)
    position = 0, 160
    halign = center
    valign = center
}
